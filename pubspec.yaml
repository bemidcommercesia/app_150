name: app_150
description: "A new Flutter project."
publish_to: 'none'
version: 1.5.7+5

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  # tools ns2kd7py
  firebase_crashlytics: ^5.0.5
  in_app_review: ^2.0.10
  get: ^4.7.2
  app_tracking_transparency: ^2.0.6+1
  collection: ^1.18.0
  appsflyer_sdk: ^6.17.9+1-rc1
  firebase_core: ^4.2.1
  path: ^1.9.0
  onesignal_flutter: ^5.3.4
  crypto: ^3.0.3
  package_info_plus: ^9.0.1
  flutter_html: ^3.0.0
  async: ^2.11.0
  url_launcher: ^6.3.2
  firebase_analytics: ^12.0.4
  flutter_udid: ^4.0.0
  wakelock_plus: ^1.3.2
  flutter_svg: ^2.1.0
  firebase_messaging: ^16.0.4

  track_source_ns2kd7py:
    path: parts_ns2kd7py/track_source_ns2kd7py

  run_count_stat_ns2kd7py:
    path: parts_ns2kd7py/run_count_stat_ns2kd7py

  conn_ping_tool_ns2kd7py:
    path: parts_ns2kd7py/conn_ping_tool_ns2kd7py

  feedback_popup_ns2kd7py:
    path: parts_ns2kd7py/feedback_popup_ns2kd7py

  fb_tracking_ids_ns2kd7py:
    path: parts_ns2kd7py/fb_tracking_ids_ns2kd7py

  layout_scaling_tool_ns2kd7py:
    path: parts_ns2kd7py/layout_scaling_tool_ns2kd7py

  web_input_screen_ns2kd7py:
    path: parts_ns2kd7py/web_input_screen_ns2kd7py


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # gen
  flutter_launcher_icons: ^0.14.3
  flutter_gen: ^5.10.0
  build_runner: ^2.4.15
  change_app_package_name: ^1.5.0
  flutter_gen_runner: ^5.10.0
  flutter_native_splash: ^2.4.6

# Pinned until Flutter native-assets reliably ships ios_sim_arm64 for package:objective_c
# (simulator runs were loading an ios_arm64 slice from path_provider_foundation 2.6.x).
dependency_overrides:
  path_provider_foundation: 2.5.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/png/
    - assets/images/svg/

  fonts:
    - family: MPLUS1
      fonts:
        - asset: assets/fonts/MPLUS1-Regular.ttf
          weight: 400
        - asset: assets/fonts/MPLUS1-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/MPLUS1-Bold.ttf
          weight: 700
    - family: Kufam
      fonts:
        - asset: assets/fonts/Kufam-Regular.ttf
          weight: 400
        - asset: assets/fonts/Kufam-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Kufam-Bold.ttf
          weight: 700

flutter_native_splash:
  ios: true
  android: false
  web: false
  background_image: assets/images/png/splash_bg.png